{% extends 'base.html' %}
{% block title %}Add Patient{% endblock %}
{% block content %}
<h2 class="mb-4">Add Patient</h2>
<form method="POST" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" name="age" class="form-control" min="0">
    </div>
    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Save Patient</button>
    <a href="{{ url_for('patients') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
